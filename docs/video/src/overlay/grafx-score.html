<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Overlay — 위험 점수 합산 +3+3+2+1=9</title>
<meta name="scene-duration" content="6" />
<link rel="stylesheet" href="../motion/common.css" />
<style>
  body.transparent { background: transparent; }

  .box {
    position: fixed;
    right: 80px;
    top: 240px;
    width: 540px;
    padding: 32px 36px 36px;
    background: rgba(255, 255, 255, 0.98);
    border: 1px solid var(--line);
    opacity: 0;
    transform: translateY(10px);
    animation: boxIn 0.6s ease-out 0.2s forwards, boxOut 0.6s ease-in 5.4s forwards;
  }
  @keyframes boxIn  { to { opacity: 1; transform: translateY(0); } }
  @keyframes boxOut { to { opacity: 0; transform: translateY(-10px); } }

  .title {
    font-size: 16px;
    color: var(--mute);
    letter-spacing: -0.01em;
    margin-bottom: 20px;
  }

  .items {
    list-style: none;
  }
  .item {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    opacity: 0;
    transform: translateY(8px);
    animation: itemIn 0.4s ease-out forwards;
  }
  .item .name { font-size: 20px; color: var(--ink); letter-spacing: -0.01em; }
  .item .val { font-size: 22px; color: var(--risk); font-weight: 600; font-feature-settings: 'tnum'; }
  .item:nth-child(1) { animation-delay: 1.1s; }
  .item:nth-child(2) { animation-delay: 1.8s; }
  .item:nth-child(3) { animation-delay: 2.5s; }
  .item:nth-child(4) { animation-delay: 3.2s; }
  @keyframes itemIn { to { opacity: 1; transform: translateY(0); } }

  .sum {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    padding-top: 20px;
    margin-top: 6px;
    opacity: 0;
    animation: sumIn 0.6s ease-out 4.0s forwards;
  }
  .sum .name { font-size: 20px; color: var(--mute); }
  .sum .val  { font-size: 56px; color: var(--risk); font-weight: 800; letter-spacing: -0.02em; font-feature-settings: 'tnum'; line-height: 1; }
  @keyframes sumIn { to { opacity: 1; } }
</style>
</head>
<body class="transparent">
  <div class="box">
    <div class="title">위험 점수 합산</div>
    <ul class="items">
      <li class="item"><span class="name">운영 환경</span><span class="val">+3</span></li>
      <li class="item"><span class="name">디비 스키마 변경</span><span class="val">+3</span></li>
      <li class="item"><span class="name">롤백 계획 없음</span><span class="val">+2</span></li>
      <li class="item"><span class="name">심야 작업</span><span class="val">+1</span></li>
    </ul>
    <div class="sum">
      <span class="name">합계</span>
      <span class="val">9</span>
    </div>
  </div>
</body>
</html>
