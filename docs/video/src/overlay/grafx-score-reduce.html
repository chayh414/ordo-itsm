<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Overlay — 9 → 7 대비</title>
<meta name="scene-duration" content="5" />
<link rel="stylesheet" href="../motion/common.css" />
<style>
  body.transparent { background: transparent; }

  .box {
    position: fixed;
    right: 80px;
    top: 320px;
    width: 480px;
    padding: 36px 40px 42px;
    background: rgba(255, 255, 255, 0.98);
    border: 1px solid var(--line);
    opacity: 0;
    transform: translateY(10px);
    animation: boxIn 0.6s ease-out 0.2s forwards, boxOut 0.6s ease-in 4.4s forwards;
  }
  @keyframes boxIn  { to { opacity: 1; transform: translateY(0); } }
  @keyframes boxOut { to { opacity: 0; transform: translateY(-10px); } }

  .title {
    font-size: 16px;
    color: var(--mute);
    letter-spacing: -0.01em;
    margin-bottom: 24px;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: baseline;
    column-gap: 24px;
  }

  .side { text-align: center; }
  .side .cap { font-size: 15px; color: var(--mute); margin-bottom: 6px; }
  .side .num {
    font-size: 112px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--risk);
    font-feature-settings: 'tnum';
  }

  .side.before .num {
    opacity: 0;
    animation: before 0.6s ease-out 0.9s forwards;
  }
  @keyframes before { to { opacity: 1; } }

  .arrow {
    font-size: 56px;
    color: var(--faint);
    font-weight: 300;
    opacity: 0;
    animation: arrowIn 0.5s ease-out 1.8s forwards;
  }
  @keyframes arrowIn { to { opacity: 1; } }

  .side.after .num {
    opacity: 0;
    animation: afterIn 0.7s ease-out 2.6s forwards;
  }
  @keyframes afterIn {
    0%   { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .note {
    margin-top: 18px;
    text-align: center;
    font-size: 16px;
    color: var(--mute);
    opacity: 0;
    animation: fadeIn 0.6s ease-out 3.3s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body class="transparent">
  <div class="box">
    <div class="title">롤백 절차 보완 → 재평가</div>
    <div class="row">
      <div class="side before"><div class="cap">보완 전</div><div class="num">9</div></div>
      <div class="arrow">→</div>
      <div class="side after"><div class="cap">보완 후</div><div class="num">7</div></div>
    </div>
    <div class="note">위험 요인 "롤백 계획 없음" 제거 (-2)</div>
  </div>
</body>
</html>
