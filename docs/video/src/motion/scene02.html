<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>SCENE 02 — 문제 정의</title>
<meta name="scene-duration" content="20" />
<link rel="stylesheet" href="common.css" />
<style>
  html, body { background: var(--bg); }
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    animation: slowPan 20s linear forwards;
    transform-origin: center;
  }
  @keyframes slowPan {
    0%   { transform: scale(1.00) translateY(16px); }
    100% { transform: scale(1.04) translateY(-10px); }
  }
  .wrap { width: 1120px; }
  .label {
    font-size: 18px;
    color: var(--mute);
    letter-spacing: 0.02em;
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 0.6s forwards;
  }
  .row {
    display: grid;
    grid-template-columns: 60px 1fr;
    align-items: baseline;
    padding: 32px 0;
    border-top: 1px solid var(--line);
    opacity: 0;
    transform: translateY(16px);
  }
  .row:last-child { border-bottom: 1px solid var(--line); }
  .row:nth-of-type(1) { animation: fadeUp 1.4s ease-out 2.2s forwards, numFocus 2.4s ease-in-out 4.6s forwards; }
  .row:nth-of-type(2) { animation: fadeUp 1.4s ease-out 5.6s forwards, numFocus 2.4s ease-in-out 8.0s forwards; }
  .row:nth-of-type(3) { animation: fadeUp 1.4s ease-out 9.0s forwards, numFocus 2.4s ease-in-out 11.4s forwards; }
  .row:nth-of-type(4) { animation: fadeUp 1.4s ease-out 12.4s forwards, numFocus 2.4s ease-in-out 14.8s forwards; }
  @keyframes numFocus {
    0%   { color: var(--faint); }
    40%  { color: var(--ink); }
    100% { color: var(--faint); }
  }
  .num { font-size: 20px; color: var(--faint); font-feature-settings: 'tnum'; }
  .text { font-size: 48px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); line-height: 1.15; }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="wrap">
      <div class="label">운영 요청의 네 가지 문제</div>
      <div class="row"><div class="num">1</div><div class="text">흩어진 채널</div></div>
      <div class="row"><div class="num">2</div><div class="text">빠진 정보</div></div>
      <div class="row"><div class="num">3</div><div class="text">위험한 변경</div></div>
      <div class="row"><div class="num">4</div><div class="text">보이지 않는 현황</div></div>
    </div>
  </div>
</body>
</html>
