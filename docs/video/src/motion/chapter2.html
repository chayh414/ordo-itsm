<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Chapter 2</title>
<meta name="scene-duration" content="2.5" />
<link rel="stylesheet" href="common.css" />
<style>
  html, body { background: var(--bg); overflow: hidden; }
  .stage { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 24px; }
  .num { font-size: 26px; color: var(--mute); letter-spacing: 0.06em; opacity: 0; animation: fadeUp 0.4s ease-out 0.1s forwards; }
  .title { font-size: 104px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--ink); opacity: 0; transform: translateY(18px); animation: fadeUp 0.4s ease-out 0.25s forwards; }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="stage">
    <div class="num">02</div>
    <div class="title">빠진 정보를 채우다</div>
  </div>
</body>
</html>
