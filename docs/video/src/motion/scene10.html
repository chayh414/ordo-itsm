<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>SCENE 10 — 요약</title>
<meta name="scene-duration" content="20" />
<link rel="stylesheet" href="common.css" />
<style>
  html, body { background: var(--bg); }
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 72px;
    animation: slowRise 20s linear forwards;
  }
  @keyframes slowRise {
    0%   { transform: translateY(12px) scale(1.00); }
    100% { transform: translateY(-14px) scale(1.03); }
  }
  .cards { display: grid; grid-template-columns: repeat(4, 300px); gap: 36px; }
  .card {
    width: 300px; height: 200px; border: 1px solid var(--line);
    padding: 24px 26px;
    display: flex; flex-direction: column; justify-content: space-between;
    opacity: 0; transform: translateY(16px);
    animation: fadeUp 1.2s ease-out forwards;
  }
  .card:nth-child(1) { animation-delay: 0.6s; }
  .card:nth-child(2) { animation-delay: 2.6s; }
  .card:nth-child(3) { animation-delay: 4.6s; }
  .card:nth-child(4) { animation-delay: 6.6s; }
  .card .label { font-size: 15px; color: var(--mute); letter-spacing: -0.01em; }
  .card .big {
    font-size: 44px; font-weight: 700; color: var(--ink);
    letter-spacing: -0.02em; line-height: 1;
    font-feature-settings: 'tnum';
  }
  .card.risk .big { color: var(--risk); }
  .nums {
    display: flex; gap: 96px; align-items: baseline; margin-top: 24px;
    opacity: 0;
    animation: fadeUp 1.4s ease-out 9.0s forwards;
  }
  .num { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .num .n {
    font-size: 64px; font-weight: 700; letter-spacing: -0.03em;
    line-height: 1; color: var(--ink);
    font-feature-settings: 'tnum';
  }
  .num .l { font-size: 17px; color: var(--mute); letter-spacing: -0.01em; }
  .num:nth-child(1) .n { animation: emphasize 2.0s ease-in-out 12.5s forwards; }
  .num:nth-child(2) .n { animation: emphasize 2.0s ease-in-out 14.5s forwards; }
  .num:nth-child(3) .n { animation: emphasize 2.0s ease-in-out 16.5s forwards; }
  @keyframes emphasize {
    0%, 100% { transform: scale(1.00); color: var(--ink); }
    40%      { transform: scale(1.04); color: var(--accent); }
  }
  .footnote {
    margin-top: 36px; font-size: 20px; color: var(--mute);
    opacity: 0;
    animation: fadeUp 1.2s ease-out 14.0s forwards;
  }
  .footnote .dot { color: var(--faint); margin: 0 12px; }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="cards">
      <div class="card risk"><div class="label">요청서 초안</div><div class="big">9점</div></div>
      <div class="card"><div class="label">보완 → 재평가</div><div class="big">9 → 7</div></div>
      <div class="card"><div class="label">백오피스</div><div class="big">위험 이력</div></div>
      <div class="card"><div class="label">실시간 알림</div><div class="big">3분할</div></div>
    </div>
    <div class="nums">
      <div class="num"><div class="n">40 / 40</div><div class="l">AI 도구 선택</div></div>
      <div class="num"><div class="n">104</div><div class="l">자동 테스트</div></div>
      <div class="num"><div class="n">23 / 25</div><div class="l">시나리오</div></div>
    </div>
    <div class="footnote">사내 GPU · 로컬 AI<span class="dot">·</span>요청 내용 외부 전송 없음</div>
  </div>
</body>
</html>
