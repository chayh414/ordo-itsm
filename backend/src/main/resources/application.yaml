spring:
  application:
    name: itsm

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:ordo}
    username: ${POSTGRES_USER:ordo}
    password: ${POSTGRES_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: validate      # 테이블 생성은 Flyway가 담당, JPA는 검증만
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    encoding:
      charset: UTF-8
      force: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:ordo-local-dev-secret-key-must-be-at-least-32-bytes}
  expiration-seconds: 3600

logging:
  level:
    org.flywaydb: info
