spring:
  application:
    name: itsm

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:ordo}
    username: ${POSTGRES_USER:ordo}
    password: ${POSTGRES_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: validate      # 테이블 생성은 Flyway가 담당, JPA는 검증만
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    encoding:
      charset: UTF-8
      force: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:ordo-local-dev-secret-key-must-be-at-least-32-bytes}
  # 시연·리허설 중 토큰 만료로 끊기지 않도록 8시간. 운영 전환 시 재검토.
  expiration-seconds: 28800

logging:
  level:
    org.flywaydb: info

ordo:
  demo:
    # 시연용 API (POST /api/demo/incidents, /api/demo/tickets/{id}/sla-near) 활성화. 운영 전환 시 false.
    endpoints-enabled: ${ORDO_DEMO_ENDPOINTS_ENABLED:true}
  sla:
    # 장애 1차 통보 기한. 실제 값은 시스원 SLA 정책에 맞춰 설정.
    incident-first-response-minutes: ${ORDO_SLA_INCIDENT_FIRST_RESPONSE_MINUTES:15}
    # SLA 임박 알림 트리거 임계값. 남은 시간이 이 분수 이하이면 SLA_NEAR 발송 (2단계).
    near-threshold-minutes: ${ORDO_SLA_NEAR_THRESHOLD_MINUTES:30}

llm:
  provider: ${LLM_PROVIDER:openai-compatible}
  base-url: ${LLM_BASE_URL:http://localhost:11434/v1}
  api-key: ${LLM_API_KEY:}
  model: "${LLM_MODEL:qwen2.5:7b}"
  response-format: ${LLM_RESPONSE_FORMAT:json_schema}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:20}
  # 어시스턴트 호출의 usage.prompt_tokens 모니터링 기준. 80% 초과 시 warn 로그.
  # 로컬 Ollama 기본은 4096 이라 OLLAMA_CONTEXT_LENGTH=8192 로 올린 상태 가정.
  context-length: ${LLM_CONTEXT_LENGTH:8192}